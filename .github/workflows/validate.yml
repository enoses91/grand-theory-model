name: validate-model
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Mechanical coherence (validate_model)
        run: python tools/validate_model.py --root .
      - name: Reference resolution (cor_lint)
        run: python tools/cor_lint.py --root . --cor COR.yaml --check-paths
